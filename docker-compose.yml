version: '3.9'

services:
  web:
    build: .
    container_name: cantina_web
    restart: always
    command: gunicorn cantina.wsgi:application --bind 0.0.0.0:8000 --workers 3
    environment:
      # o WhiteNoise só comprime e versiona os estáticos com DEBUG desligado
      DJANGO_DEBUG: "False"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8083:8000"

volumes:
  static_volume:
